name: Dependency Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Match Flutter CI / Android lint toolchain (AGP 9.3.x needs JDK 21).
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Resolve complete Flutter and Android dependency graph
        run: |
          set -euo pipefail
          mkdir -p build/dependency-security
          flutter pub get
          flutter pub deps --json > build/dependency-security/flutter-dependencies.json

          # This repository intentionally does not commit Gradle launcher scripts.
          # Flutter creates the compatible wrapper during the first Android build.
          flutter build apk --debug --flavor internal --no-pub
          (cd android && ./gradlew :app:dependencies --configuration productionReleaseRuntimeClasspath) \
            > build/dependency-security/android-production-dependencies.txt

          APP_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          python3 scripts/generate-android-sbom.py \
            --pub build/dependency-security/flutter-dependencies.json \
            --gradle build/dependency-security/android-production-dependencies.txt \
            --output build/dependency-security/wachbuch-android.cdx.json \
            --osv-output build/dependency-security/osv-scanner.json \
            --version "$APP_VERSION"
          python3 -m json.tool build/dependency-security/osv-scanner.json >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-dependencies
          path: build/dependency-security
          if-no-files-found: error
          retention-days: 2

  osv-scan:
    needs: prepare
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      download-artifact: osv-dependencies
      scan-args: |-
        --lockfile=osv-scanner:osv-scanner.json
      upload-sarif: false
      fail-on-vuln: true
