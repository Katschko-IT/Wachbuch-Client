name: wachbuch_mobile
description: AGPL companion app for self-hosted Wachbuch (iOS/Android).
publish_to: "none"
version: 1.0.0+12

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^7.2.2
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  geolocator: ^14.1.2
  http: ^1.4.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  permission_handler: ^12.0.3
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
  fonts:
    # Atkinson Hyperlegible Next, SIL Open Font License 1.1
    # Quelle: github.com/googlefonts/atkinson-hyperlegible-next (fonts/ttf)
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
